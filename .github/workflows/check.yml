name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/check.ps1
      - name: Check with PowerShell 7
        shell: pwsh
        run: ./tests/check.ps1
      - name: Build launcher
        shell: pwsh
        run: ./scripts/package.ps1
